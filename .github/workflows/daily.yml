name: daily

# Runs every day at 07:27 JST (22:27 UTC). Minute is not :00 to spread load
# off the hour. Claude's summary task reads status/summary.json at 08:37 JST,
# so the summarize job must finish well before then.
on:
  schedule:
    - cron: "27 22 * * *"
  workflow_dispatch:
    inputs:
      total_shards:
        description: "Total shard count (override)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  # Shards split the registry round-robin. Grow this (and the matrix below)
  # as the registry grows; each shard should handle roughly <=300 bans and we
  # cap concurrency at 10. For now one shard is plenty.
  TOTAL_SHARDS: "1"

jobs:
  run:
    name: "shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v4
        with:
          # We need prior data/*.json so previous_record_count can compute deltas.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run shard
        run: |
          python runner/run.py --shard ${{ matrix.shard }} --total ${{ env.TOTAL_SHARDS }}
      - name: Upload shard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            data/
            status/${{ matrix.shard }}.jsonl
            status/fetch-errors.jsonl
          if-no-files-found: ignore
          retention-days: 7

  summarize:
    name: summarize and commit
    needs: run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
      - name: Run summarizer
        run: python runner/summarize.py
      - name: Commit and push
        run: |
          git config user.name "ban-bots"
          git config user.email "ban-bots@users.noreply.github.com"
          git add data status
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            STAMP=$(TZ=Asia/Tokyo date --iso-8601=seconds)
            git commit -m "daily: ${STAMP}"
            # Retry push a couple of times in case of concurrent pushes.
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then
                exit 0
              fi
              sleep $((i * 5))
            done
            exit 1
          fi
